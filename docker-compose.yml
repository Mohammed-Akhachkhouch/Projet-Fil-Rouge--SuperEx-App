services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: superex_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: superex_db
    ports:
      - "5600:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - superex_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: superex_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 123456
      DB_NAME: superex_db
      DB_SYNC_FORCE: false
      JWT_SECRET: superex_secret_key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - superex_network
    volumes:
      - ./Backend:/app
      - /app/node_modules

volumes:
  postgres_data:
    driver: local

networks:
  superex_network:
    driver: bridge
